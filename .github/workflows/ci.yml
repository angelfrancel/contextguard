name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contextguard
          POSTGRES_USER: contextguard
          POSTGRES_PASSWORD: contextguard-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextguard -d contextguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/contextguard
      SPRING_DATASOURCE_USERNAME: contextguard
      SPRING_DATASOURCE_PASSWORD: contextguard-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrappers executable
        run: chmod +x mvnw demoupstream/mvnw
      - name: Test ContextGuard
        run: ./mvnw --batch-mode test
      - name: Test demo upstream
        working-directory: demoupstream
        run: ./mvnw --batch-mode test
      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports
            demoupstream/target/surefire-reports
          if-no-files-found: ignore

  e2e-verification:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: contextguard
          POSTGRES_USER: contextguard
          POSTGRES_PASSWORD: contextguard-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextguard -d contextguard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/contextguard
      SPRING_DATASOURCE_USERNAME: contextguard
      SPRING_DATASOURCE_PASSWORD: contextguard-ci-only
      CONTEXTGUARD_UPSTREAM_URL: http://127.0.0.1:18081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven wrappers executable
        run: chmod +x mvnw demoupstream/mvnw
      - name: Package applications
        run: |
          ./mvnw --batch-mode -DskipTests package
          (cd demoupstream && ./mvnw --batch-mode -DskipTests package)
      - name: Start applications and verify gateway
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; if (( status != 0 )); then echo "=== demo upstream log ==="; cat demo-upstream.log 2>/dev/null || true; echo "=== ContextGuard log ==="; cat contextguard.log 2>/dev/null || true; fi; if [[ -n "${gateway_pid:-}" ]]; then kill "$gateway_pid" 2>/dev/null || true; fi; if [[ -n "${upstream_pid:-}" ]]; then kill "$upstream_pid" 2>/dev/null || true; fi' EXIT

          java -jar demoupstream/target/demo-upstream-0.0.1-SNAPSHOT.jar --server.port=18081 >demo-upstream.log 2>&1 &
          upstream_pid=$!
          for attempt in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/18081) 2>/dev/null; then break; fi
            if ! kill -0 "$upstream_pid" 2>/dev/null; then echo 'Demo upstream exited early'; exit 1; fi
            sleep 2
          done
          (echo > /dev/tcp/127.0.0.1/18081) 2>/dev/null || { echo 'Demo upstream did not start'; exit 1; }

          java -jar target/contextguard-0.0.1-SNAPSHOT.jar --server.port=18080 >contextguard.log 2>&1 &
          gateway_pid=$!
          for attempt in {1..60}; do
            if (echo > /dev/tcp/127.0.0.1/18080) 2>/dev/null; then break; fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then echo 'ContextGuard exited early'; exit 1; fi
            sleep 2
          done
          (echo > /dev/tcp/127.0.0.1/18080) 2>/dev/null || { echo 'ContextGuard did not start'; exit 1; }

          pwsh -File ./scripts/verify-gateway.ps1 -GatewayUrl http://127.0.0.1:18080/mcp
