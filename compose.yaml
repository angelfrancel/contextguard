services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contextguard
      POSTGRES_USER: contextguard
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextguard -d contextguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  demoupstream:
    build:
      context: ./demoupstream
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  contextguard:
    build:
      context: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      CONTEXTGUARD_UPSTREAM_URL: http://demoupstream:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/contextguard
      SPRING_DATASOURCE_USERNAME: contextguard
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      demoupstream:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
