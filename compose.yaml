services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: contextguard
      POSTGRES_USER: contextguard
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextguard -d contextguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: