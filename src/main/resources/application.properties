spring.application.name=contextguard
spring.ai.mcp.client.name=contextguard-upstream-client
spring.ai.mcp.client.version=0.0.1
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=10s

spring.ai.mcp.client.streamable-http.connections.demo-upstream.url=http://127.0.0.1:8081
spring.ai.mcp.client.streamable-http.connections.demo-upstream.endpoint=/mcp

server.address=127.0.0.1
server.port=8080

spring.ai.mcp.server.name=contextguard
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC

spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false