spring.application.name=contextguard
spring.ai.mcp.client.name=contextguard-upstream-client
spring.ai.mcp.client.version=0.0.1
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=10s
spring.ai.mcp.client.toolcallback.enabled=false

spring.ai.mcp.client.streamable-http.connections.upstream.url=${CONTEXTGUARD_UPSTREAM_URL:http://127.0.0.1:8081}
spring.ai.mcp.client.streamable-http.connections.upstream.endpoint=${CONTEXTGUARD_UPSTREAM_ENDPOINT:/mcp}

server.address=127.0.0.1
server.port=8080

spring.ai.mcp.server.name=contextguard
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.expose-mcp-client-tools=false
spring.ai.mcp.server.annotation-scanner.enabled=false

spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/contextguard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:contextguard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
